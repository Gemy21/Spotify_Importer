name: Build Android APK

on:
  push:
    branches:
      - android-app
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Android Assets
        run: npm run build:android
        env:
          NODE_ENV: production

      - name: Verify Assets Were Bundled
        run: |
          echo "=== Verifying Android assets ==="
          if [ ! -f "android/app/src/main/assets/www/index.html" ]; then
            echo "ERROR: index.html missing from assets! Build will produce a black screen."
            exit 1
          fi
          echo "✅ index.html found"
          echo "=== Asset tree (first 50 lines) ==="
          find android/app/src/main/assets/www -type f | head -50
          echo "=== Total files ==="
          find android/app/src/main/assets/www -type f | wc -l

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/SpotifyImporter-v1.0.0.apk
          echo "APK size: $(du -sh release-artifacts/SpotifyImporter-v1.0.0.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyImporter-v1.0.0
          path: release-artifacts/SpotifyImporter-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/SpotifyImporter-v1.0.0.apk
          tag_name: v1.0.0-android
          name: Spotify Importer Android v1.0.0
          body: |
            ### 🎵 Spotify Importer for Android (APK)

            This APK runs **100% locally on your Android device** — no cloud servers, no accounts required.

            - **🚀 Zero Setup**: No Spotify API credentials needed.
            - **📋 Full Playlist Browser**: Fetch and browse complete Spotify libraries.
            - **📱 Native Android App**: Wrapped in a native WebView — feels like a real app.
            - **🏷️ Local-First**: Runs 100% on your phone with zero hosting needed.

            #### 📲 Installation:
            1. Download **`SpotifyImporter-v1.0.0.apk`** below.
            2. Open the file on your Android device (allow "Install from Unknown Sources" if prompted).
            3. Open the app and start browsing your Spotify playlists!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
