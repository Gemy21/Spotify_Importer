name: Build Android APK

on:
  push:
    branches:
      - android-app
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Prepare Assets
        run: |
          npm ci
          npm run build:android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/*.apk release-artifacts/SpotifyImporter-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyImporter-v1.0.0
          path: release-artifacts/SpotifyImporter-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/SpotifyImporter-v1.0.0.apk
          tag_name: v1.0.0-android
          name: Spotify Importer Android v1.0.0
          body: |
            ### 🎵 Spotify Importer for Android (APK)

            This APK runs **100% locally on your Android device** with zero cloud servers required.

            - **🚀 100% Keyless & Free**: No Spotify account or API credentials required.
            - **📈 Unlimited Playlist Imports**: Fetches complete libraries with real album covers.
            - **🎧 Studio Audio Downloader**: SpotDL matching algorithm for high quality audio.
            - **🏷️ Automated ID3v2 Tagging**: Full metadata & 640×640 artwork embedded directly into audio.
            - **📜 Synced Lyrics**: Time-synced `.lrc` and plain `.txt` lyrics.
            - **📱 Local-First**: Runs 100% on your local phone with zero hosting needed.

            #### 📲 Installation:
            1. Download **`SpotifyImporter-v1.0.0.apk`** below.
            2. Open the file on your Android device to install (allow "Install from Unknown Sources" if prompted).
            3. Enjoy full Spotify importing directly on your phone!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
