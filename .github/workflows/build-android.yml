name: Build Android APK

on:
  push:
    branches:
      - android-app
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/SpotifyImporter-v1.0.0.apk
          echo "APK size: $(du -sh release-artifacts/SpotifyImporter-v1.0.0.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyImporter-v1.0.0
          path: release-artifacts/SpotifyImporter-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/SpotifyImporter-v1.0.0.apk
          tag_name: v1.0.0-android
          name: Spotify Importer Native Android v1.0.0
          body: |
            ### 🎵 Spotify Importer for Android (Native APK)

            This native Android app runs **100% locally on your Android device** — no cloud servers, no Node.js backend required!

            - **📱 Pure Native Kotlin & Jetpack Compose UI**: Fast, responsive dark UI built with Spotify aesthetics.
            - **⚡ Local yt-dlp & FFmpeg Engine**: Bundled native YoutubeDL + FFmpeg engine downloads and converts audio directly on your phone.
            - **🎧 Quality & Format Selector**: Download in MP3, M4A, or OPUS with selectable bitrates (320kbps, 256kbps, 192kbps, 128kbps).
            - **🏷️ Automatic ID3 Tagging & Album Covers**: Embeds artist, track title, album name, and 640x640 album artwork right into the audio files.
            - **📝 Lyrics Sync (LRCLIB)**: Automatically fetches synchronized `.lrc` and plain lyrics saved straight to your device.
            - **📂 Public Music Folder**: Downloaded tracks are automatically saved into your device's `Music/SpotifyImporter` folder and instantly appear in all music players.

            #### 📲 Installation:
            1. Download **`SpotifyImporter-v1.0.0.apk`** below.
            2. Tap to install (enable "Install from Unknown Sources" if prompted).
            3. Grant audio storage permissions when prompted.
            4. Paste any Spotify playlist/track URL or search query and tap **Import / Search**!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
